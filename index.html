<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sarı Video İndirici</title>
    <style>
        :root {
            --bg-color: #121212;
            --card-bg: #1e1e1e;
            --accent-yellow: #f1c40f;
            --accent-hover: #d4ac0d;
            --text-color: #ffffff;
            --text-muted: #a0a0a0;
            --error-color: #e74c3c;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            background-color: var(--card-bg);
            border-radius: 12px;
            padding: 30px;
            width: 100%;
            max-width: 480px;
            box-shadow: 0 8px 24px rgba(241, 196, 15, 0.15);
            border: 1px solid rgba(241, 196, 15, 0.2);
        }

        .header {
            text-align: center;
            margin-bottom: 24px;
        }

        .header h1 {
            color: var(--accent-yellow);
            font-size: 1.8rem;
            margin-bottom: 8px;
        }

        .header p {
            color: var(--text-muted);
            font-size: 0.9rem;
        }

        .input-group {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 20px;
        }

        input[type="text"] {
            width: 100%;
            padding: 14px;
            border-radius: 8px;
            border: 2px solid #333;
            background-color: #2a2a2a;
            color: #fff;
            font-size: 0.95rem;
            outline: none;
            transition: border-color 0.3s;
        }

        input[type="text"]:focus {
            border-color: var(--accent-yellow);
        }

        button {
            background-color: var(--accent-yellow);
            color: #000;
            border: none;
            padding: 14px;
            border-radius: 8px;
            font-weight: bold;
            font-size: 1rem;
            cursor: pointer;
            transition: background-color 0.2s, transform 0.1s;
        }

        button:hover {
            background-color: var(--accent-hover);
        }

        button:active {
            transform: scale(0.98);
        }

        .status-message {
            margin-top: 15px;
            font-size: 0.85rem;
            text-align: center;
            min-height: 20px;
        }

        .status-message.error {
            color: var(--error-color);
        }

        .status-message.info {
            color: var(--accent-yellow);
        }

        .footer {
            margin-top: 20px;
            text-align: center;
            font-size: 0.75rem;
            color: var(--text-muted);
            border-top: 1px solid #2a2a2a;
            padding-top: 15px;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h1>Video İndirici</h1>
        <p>TikTok & Instagram İçerik İndirme</p>
    </div>

    <div class="input-group">
        <input type="text" id="videoUrl" placeholder="Video bağlantısını yapıştırın...">
        <button onclick="processDownload()">Videoyu Getir</button>
    </div>

    <div id="status" class="status-message"></div>

    <div class="footer">
    </div>
</div>

<script>
    function processDownload() {
        const urlInput = document.getElementById('videoUrl').value.trim();
        const statusDiv = document.getElementById('status');

        statusDiv.className = 'status-message';
        statusDiv.innerText = '';

        if (!urlInput) {
            statusDiv.className = 'status-message error';
            statusDiv.innerText = 'Lütfen geçerli bir URL girin.';
            return;
        }

        // İşlem başarılı mesajı
        statusDiv.className = 'status-message info';
        statusDiv.innerText = 'Bağlantı işleniyor...';
    }
</script>
</body>
</html>
