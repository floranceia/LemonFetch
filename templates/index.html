<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LemonFetch</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🍋</text></svg>">
    <style>
        :root {
            --bg-color: #121212;
            --card-bg: #1e1e1e;
            --accent-yellow: #f1c40f;
            --accent-hover: #d4ac0d;
            --text-color: #ffffff;
            --text-muted: #a0a0a0;
            --error-color: #e74c3c;
            --input-bg: #2a2a2a;
            --input-border: #333;
        }

        .light-mode {
            --bg-color: #f4f4f9;
            --card-bg: #ffffff;
            --text-color: #333333;
            --text-muted: #666666;
            --input-bg: #f9f9f9;
            --input-border: #e0e0e0;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            transition: background-color 0.3s, color 0.3s;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
            position: relative;
        }

        .theme-toggle {
            position: absolute;
            top: 20px;
            right: 20px;
            background-color: var(--card-bg);
            color: var(--text-color);
            border: 1px solid var(--input-border);
            padding: 8px 16px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 0.85rem;
            font-weight: 600;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }

        .theme-toggle:hover {
            opacity: 0.8;
        }

        .container {
            background-color: var(--card-bg);
            border-radius: 12px;
            padding: 30px;
            width: 100%;
            max-width: 480px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.2);
            border: 1px solid var(--input-border);
        }

        .header {
            text-align: center;
            margin-bottom: 24px;
        }

        .header h1 {
            color: var(--accent-yellow);
            font-size: 2rem;
            margin-bottom: 8px;
        }

        .header p {
            color: var(--text-muted);
            font-size: 0.9rem;
        }

        .input-group {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 20px;
        }

        input[type="text"] {
            width: 100%;
            padding: 14px;
            border-radius: 8px;
            border: 2px solid var(--input-border);
            background-color: var(--input-bg);
            color: var(--text-color);
            font-size: 0.95rem;
            outline: none;
            transition: border-color 0.3s;
        }

        input[type="text"]:focus {
            border-color: var(--accent-yellow);
        }

        button.action-btn {
            background-color: var(--accent-yellow);
            color: #000;
            border: none;
            padding: 14px;
            border-radius: 8px;
            font-weight: bold;
            font-size: 1rem;
            cursor: pointer;
            transition: background-color 0.2s, transform 0.1s;
        }

        button.action-btn:hover {
            background-color: var(--accent-hover);
        }

        button.action-btn:active {
            transform: scale(0.98);
        }

        .status-message {
            margin-top: 15px;
            font-size: 0.9rem;
            text-align: center;
            min-height: 20px;
            word-break: break-all;
        }

        .status-message.error {
            color: var(--error-color);
        }

        .status-message.info {
            color: var(--accent-yellow);
        }
    </style>
</head>
<body>

<button class="theme-toggle" onclick="toggleTheme()">Modu Değiştir</button>

<div class="container">
    <div class="header">
        <h1>LemonFetch</h1>
        <p>TikTok & Instagram İçerik İndirme</p>
    </div>

    <div class="input-group">
        <input type="text" id="videoUrl" placeholder="Video bağlantısını yapıştırın...">
        <button class="action-btn" onclick="processDownload()">İndir</button>
    </div>

    <div id="status" class="status-message"></div>
</div>

<script>
    function toggleTheme() {
        document.body.classList.toggle('light-mode');
    }

    async function processDownload() {
        const urlInput = document.getElementById('videoUrl').value.trim();
        const statusDiv = document.getElementById('status');

        statusDiv.className = 'status-message';
        statusDiv.innerText = '';

        if (!urlInput) {
            statusDiv.className = 'status-message error';
            statusDiv.innerText = 'Lütfen geçerli bir URL girin.';
            return;
        }

        statusDiv.className = 'status-message info';
        statusDiv.innerText = 'Video hazırlanıyor... 🍋';

        try {
            const response = await fetch('/api/download', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ url: urlInput })
            });

            const data = await response.json();

            if (!response.ok) {
                throw new Error(data.error || 'Video getirilemedi.');
            }

            statusDiv.className = 'status-message info';
            // download="lemonfetch.mp4" özniteliği sayesinde dosya her zaman bu isimle iner
            statusDiv.innerHTML = `Başarılı! <a href="${data.download_url}" download="lemonfetch.mp4" target="_blank" style="color: var(--accent-yellow); font-weight: bold;">Videoyu Buradan İndir 📥</a>`;
        } catch (error) {
            statusDiv.className = 'status-message error';
            statusDiv.innerText = error.message;
        }
    }
</script>
</body>
</html>
